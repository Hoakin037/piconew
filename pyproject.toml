[project]
name = "pico"
version = "0.1.0"
description = ""

requires-python = ">=3.12"
dependencies = [
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "fastapi>=0.135.2,<0.136.0",
    "sqlalchemy>=2.0.48,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "uvicorn>=0.42.0,<0.43.0",
    "pyjwt (>=2.12.1,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "python-socketio (>=5.16.1,<6.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "python-magic-bin (>=0.4.14,<0.5.0)",
